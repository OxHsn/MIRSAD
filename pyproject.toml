[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirsad"
version = "1.0.0"
description = "MIRSAD — unified identity intelligence: username, email, domain and GitHub OSINT in one tool"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "0xHsn", email = "OxHsn@users.noreply.github.com" }]
maintainers = [{ name = "0xHsn", email = "OxHsn@users.noreply.github.com" }]
keywords = ["osint", "recon", "username", "email", "github", "breach", "identity", "security"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.28.1",
    "dnspython>=2.8.0",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "ruff>=0.17.1"]

[project.urls]
Homepage = "https://github.com/OxHsn"
Repository = "https://github.com/OxHsn/MIRSAD"
Issues = "https://github.com/OxHsn/MIRSAD/issues"
Changelog = "https://github.com/OxHsn/MIRSAD/blob/main/CHANGELOG.md"

[project.scripts]
mirsad = "mirsad.cli:main"

[tool.setuptools]
packages = ["mirsad", "mirsad.core", "mirsad.modules", "mirsad.report"]

[tool.setuptools.package-data]
mirsad = ["data/*.json", "data/*.gz"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
